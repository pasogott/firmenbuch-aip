[project]
name = "firmenbuch-cli"
version = "0.2.0"
description = "🇦🇹 CLI für das österreichische Firmenbuch - Zugriff auf die offiziellen HVD WebServices"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Pascal Gottfried"}
]
keywords = ["firmenbuch", "austria", "cli", "api", "hvd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "httpx>=0.28.1",
    "lxml>=5.4.0",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "xmltodict>=0.14.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.12.8",
]

[project.scripts]
firmenbuchat = "firmenbuch_api_oesterreich.cli.app:main"

[project.urls]
Homepage = "https://github.com/pasogott/firmenbuch-aip"
Documentation = "https://github.com/pasogott/firmenbuch-aip/tree/main/docs"
Repository = "https://github.com/pasogott/firmenbuch-aip"
Issues = "https://github.com/pasogott/firmenbuch-aip/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firmenbuch_api_oesterreich"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["field_validator", "model_validator"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
